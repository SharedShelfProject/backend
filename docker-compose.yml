services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-shelf-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: shared-shelf-app
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      PORT: ${PORT}
      APP_URL: ${APP_URL}
      NOTIFICATIONS_SCAN_INTERVAL_MS: ${NOTIFICATIONS_SCAN_INTERVAL_MS}
      LOAN_REMINDER_HOURS_BEFORE_DUE: ${LOAN_REMINDER_HOURS_BEFORE_DUE}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
